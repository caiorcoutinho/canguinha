<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Canguinha</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦘</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <style>
    .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .login-card { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; text-align: center; box-shadow: var(--shadow); }
    .login-card h1 { font-size: 22px; margin: 8px 0 4px; }
    .login-card p { color: var(--text-2); margin: 0 0 20px; font-size: 13px; }
    .gbtn { display: inline-flex; align-items: center; gap: 10px; justify-content: center; width: 100%; padding: 10px 14px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-weight: 600; text-decoration: none; }
    .gbtn:hover { background: var(--surface-2); }
    .gbtn svg { width: 18px; height: 18px; }
    .login-err { margin-top: 14px; font-size: 13px; color: var(--neg); }
  </style>
</head>
<body>
  <main class="login">
    <div class="login-card">
      <div style="font-size:40px">🦘</div>
      <h1>Canguinha</h1>
      <p>Suas finanças pessoais. Entre com a conta Google autorizada.</p>
      <a class="gbtn" href="/auth/google/login">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Entrar com Google
      </a>
      <div class="login-err" id="err" role="alert"></div>
    </div>
  </main>
  <script>
    const MSG = {
      negado: 'Esta conta Google não tem acesso. Peça para incluírem seu e-mail em ALLOWED_EMAILS.',
      email: 'O e-mail da conta Google não está verificado.',
      cancelado: 'Login cancelado.',
      sessao: 'O login expirou ou foi interrompido. Tente de novo.',
      google: 'Não foi possível concluir o login com o Google. Tente de novo.',
    };
    const e = new URLSearchParams(location.search).get('erro');
    if (e) document.getElementById('err').textContent = MSG[e] || 'Erro no login.';
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</body>
</html>
