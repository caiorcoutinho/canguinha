# Proxy reverso na frente do Canguinha. O app só é acessível pela rede interna do compose (app:3000).
upstream canguinha {
    server app:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 2m;           # o app aceita até 1 MB (webhooks)

    gzip on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://canguinha;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # $http_host mantém a porta: o app monta a URL de retorno do login Google a partir do Host
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;       # sincronização completa com a Pluggy pode demorar
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
